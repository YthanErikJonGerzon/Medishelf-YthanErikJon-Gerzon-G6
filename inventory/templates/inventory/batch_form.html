{% extends 'accounts/base.html' %}
{% block content %}
<div class="auth-box" style="max-width:520px;">
    <h2>Add Medicine Batch</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Save Batch</button>
    </form>
    <p style="margin-top:12px;"><a href="{% url 'medicine_list' %}">← Back to Inventory</a></p>
</div>
{% endblock %}
