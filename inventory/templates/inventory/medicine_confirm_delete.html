{% extends 'accounts/base.html' %}
{% block content %}
<div class="auth-box">
    <h2 style="color:#dc2626;">Confirm Delete</h2>
    <p style="margin-bottom:16px;">Are you sure you want to permanently delete <strong>{{ medicine }}</strong> and all its batches?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn" style="background:#dc2626;">Yes, Delete Record</button>
    </form>
    <p style="margin-top:12px;"><a href="{% url 'medicine_list' %}">Cancel</a></p>
</div>
{% endblock %}
