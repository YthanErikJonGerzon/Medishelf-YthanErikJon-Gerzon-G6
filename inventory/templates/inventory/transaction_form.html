{% extends 'accounts/base.html' %}
{% block content %}
<div class="auth-box" style="max-width:520px;">
    <h2>Record Stock-In / Stock-Out</h2>
    <form method="POST">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
        {% endif %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Submit Transaction</button>
    </form>
    <p style="margin-top:12px;"><a href="{% url 'transaction_history' %}">View Transaction History →</a></p>
</div>
{% endblock %}
